name: Release

# Manual only. A release cuts a tag, publishes console-ui to the GitHub Packages npm
# registry, builds the multi-arch images, pushes them to GHCR, and opens a GitHub Release.
# Everything lands under the one repository's packages, on the one GITHUB_TOKEN. Nothing
# here fires on push — a tag exists because someone chose to ship, not because a commit
# landed.
#
# The operator picks a bump type; the next version is derived from the latest tag, so there
# is no hand-typed version to fat-finger. This cuts stable releases only — there is no
# pre-release path here by design (add a tag by hand if you ever need an rc).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        required: true
        type: choice
        default: minor
        options:
          - major
          - minor
          - patch

# contents: write cuts the tag and the Release; packages: write pushes to GHCR *and* is
# what authenticates the npm publish to npm.pkg.github.com; id-token: write lets npm
# exchange the run's OIDC identity with npmjs.org (trusted publishing — no NPM_TOKEN
# secret anywhere).
permissions:
  contents: write
  packages: write
  id-token: write

# Serialise releases. The version is derived from the latest tag at run time, so two
# concurrent runs would otherwise compute the same next version and race to push it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Cut ${{ github.event.inputs.bump }} release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # fetch-depth: 0 brings the full tag history the version math reads below.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Derive the next version from the highest existing STABLE tag (vX.Y.Z) plus the
      # chosen bump. Pre-release tags are ignored as the base — this workflow only cuts
      # stable versions, and git's version sort orders "-rc" suffixes inconsistently, so
      # filtering to the plain triple sidesteps that trap. First release starts from v0.0.0
      # (→ v0.1.0 for the default minor bump).
      - name: Compute next version
        id: version
        run: |
          bump='${{ github.event.inputs.bump }}'
          latest="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)"
          if [ -z "$latest" ]; then
            latest="v0.0.0"
            echo "No stable tags yet — starting from $latest"
          fi

          core="${latest#v}"
          major="${core%%.*}"
          rest="${core#*.}"
          minor="${rest%%.*}"
          patch="${rest##*.}"

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::unknown bump type '$bump'"; exit 1 ;;
          esac
          next="v${major}.${minor}.${patch}"

          # A guard, not an expectation: by construction the computed tag is newer than the
          # base, but a tag created out of band could still collide.
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::Computed tag $next already exists (latest stable was $latest). Aborting."
            exit 1
          fi

          echo "Bumping $latest -> $next ($bump)"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "### Releasing $next (\`$bump\` bump from $latest)" >> "$GITHUB_STEP_SUMMARY"

      # Tag the exact commit this workflow ran against. Tags pushed with GITHUB_TOKEN do
      # not retrigger workflows, so there is no risk of a release loop.
      - name: Create and push tag
        run: |
          version='${{ steps.version.outputs.version }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "Daffa $version"
          git push origin "$version"

      # Publish console-ui (the shared Vue component kit under console-ui/) to the GitHub
      # Packages npm registry at the same version as the release, so a console pinning
      # @mnshahawy/daffa-console-ui@X.Y.Z and an operator running ghcr image vX.Y.Z are
      # talking about the same commit. The package ships as source (no build), so this is a
      # type-check + a version stamp + a publish.
      #
      # No publish secret to provision: GitHub Packages authenticates with the run's own
      # GITHUB_TOKEN under the `packages: write` permission already granted above for GHCR.
      # That also pins the package to this repository — the scope MUST match the repository
      # owner (@mnshahawy) or the registry rejects the publish. The version write is not
      # committed back — the tag is the record; package.json in git deliberately stays at
      # its placeholder version.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
      - name: Publish console-ui to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: console-ui
        run: |
          corepack enable
          pnpm install --frozen-lockfile=false
          pnpm run check
          version='${{ steps.version.outputs.version }}'
          npm version "${version#v}" --no-git-tag-version
          npm publish

      # Second publish target: npmjs.org, where public installs are ANONYMOUS (GitHub
      # Packages' npm endpoint demands a token even for public packages, so it can't be
      # the only home). Auth is npm Trusted Publishing: npmjs.org is configured (package
      # settings → Trusted Publisher) to trust THIS repo+workflow, and npm exchanges the
      # run's OIDC token — enabled by `id-token: write` above — for a one-shot publish
      # credential. No token secret exists; provenance is attested automatically.
      #
      # Two registry pins must be neutralised, and for a SCOPED package both outrank a
      # `--registry` flag: publishConfig in package.json (stripped — the checkout is
      # ephemeral, nothing is committed) and the `@mnshahawy:registry=npm.pkg.github.com`
      # scope mapping setup-node wrote to the runner's user npmrc for the step above. A
      # project-level .npmrc takes precedence over user config, so the scope is remapped
      # there for the duration of this publish. Requires npm ≥ 11.5 for OIDC; Node 24
      # ships newer.
      - name: Publish console-ui to npmjs.org (trusted publishing)
        working-directory: console-ui
        run: |
          npm pkg delete publishConfig
          echo "@mnshahawy:registry=https://registry.npmjs.org" > .npmrc
          npm publish --access public
          rm .npmrc

      # No QEMU: the Dockerfile builds on $BUILDPLATFORM and cross-compiles (see its header),
      # so nothing runs emulated and there is no binfmt to register.
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the owner (GHCR rejects uppercase) and expands the tag
      # set. Every release here is stable, so :latest always moves.
      #
      # The raw tag below pushes the git tag verbatim (e.g. v1.2.3) as an image tag, in
      # addition to the semver-normalised 1.2.3 / 1.2. deploy/install.sh reads the git tag
      # from the releases API and uses it unchanged for the compose ref AND the image, so
      # the tag must exist on the image exactly as written — this is what makes that hold.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      # The static, CGO-off binary cross-compiles cleanly, so both arches build from the
      # one Dockerfile. VERSION lands in the binary via -X main.version.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The agent image — the dial-out agent binary only, no SPA/server/DB drivers, ~4×
      # smaller — published alongside the console under a nested package
      # (ghcr.io/<owner>/daffa/agent). Same version tags, same multi-arch build; `target:
      # agent` selects the agent stage in the one Dockerfile. Its own cache scope keeps it
      # from evicting the console's cache (they share the gobase layers regardless).
      - name: Agent image metadata
        id: meta-agent
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/agent
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push agent
        uses: docker/build-push-action@v7
        with:
          context: .
          target: agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      # --generate-notes diffs against the previous tag on its own.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version='${{ steps.version.outputs.version }}'
          gh release create "$version" \
            --title "Daffa $version" \
            --generate-notes

  # Ready-to-use binaries on the Release, for the CLI use of the daffa binary — `daffa
  # plan` / `daffa apply` from a laptop or CI, `daffa restore --identity` on the
  # operator machine that holds the age key. It is the SAME binary the image ships
  # (server included, SPA embedded), cross-compiled per platform: one artifact, no
  # separate CLI build to drift from the server.
  #
  # A separate job on purpose: the web build needs pnpm 9 exactly (the pin the whole
  # repo carries — pnpm 10+'s ignored-builds gate exits non-zero), while the console-ui
  # publish above deliberately rides corepack's floating pnpm. Two runners keep the two
  # toolchains from fighting over one PATH.
  binaries:
    name: Attach release binaries
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Build exactly the tagged commit — not whatever the branch head has become while
      # the release job ran.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.version }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # The SPA embeds into the binary via go:embed, so it builds once, first — the
      # output is platform-independent and every cross-compile below reuses it.
      - name: Build the SPA
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Same flags as the Dockerfile: CGO off (pure-Go SQLite), trimpath, stripped,
      # version stamped. tar.gz for unix, zip for windows; SHA256SUMS covers them all.
      - name: Cross-compile and package
        run: |
          version='${{ needs.release.outputs.version }}'
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"; goarch="${target#*/}"
            bin=daffa; [ "$goos" = windows ] && bin=daffa.exe
            out="daffa_${version#v}_${goos}_${goarch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w -X main.version=${version}" \
              -o "dist/${out}/${bin}" ./cmd/daffa
            cp LICENSE "dist/${out}/"
            if [ "$goos" = windows ]; then
              (cd dist && zip -q -r "${out}.zip" "$out")
            else
              tar -czf "dist/${out}.tar.gz" -C dist "$out"
            fi
            rm -r "dist/${out}"
          done
          (cd dist && sha256sum daffa_* > SHA256SUMS)

      - name: Upload to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version='${{ needs.release.outputs.version }}'
          gh release upload "$version" dist/* --clobber
